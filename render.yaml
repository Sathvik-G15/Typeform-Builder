databases:
  - name: typeform-db
    databaseName: typeform
    user: typeform
    plan: free

services:
  # ── FastAPI Backend ──────────────────────────────────────────────
  - type: web
    name: typeform-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: typeform-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false          # Fill this in Render dashboard after frontend deploys
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /api/health
    autoDeploy: true

  # ── Next.js Frontend ─────────────────────────────────────────────
  - type: web
    name: typeform-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: node .next/standalone/server.js
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: typeform-backend
          type: web
          property: hostport
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
    autoDeploy: true
