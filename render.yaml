databases:
  - name: typeform-db
    databaseName: typeform
    user: typeform
    plan: free

services:
  # ── Single unified service (Frontend + Backend + Nginx) ──────────
  - type: web
    name: typeform-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: typeform-db
          property: connectionString
      - key: PORT
        value: "8080"
    healthCheckPath: /api/health
    autoDeploy: true
